name: 7x24 资讯

on:
  schedule:
    # 每小时（GitHub 计划任务为尽力执行，可能略有延迟）
    - cron: '0 * * * *'
  workflow_dispatch:

# 与每日精选共用串行组，避免同时改写 R2 索引。
concurrency:
  group: frontend-weekly-publish
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发布到 2aran 内容数据层
        run: node scripts/publish-2aran-feed.mjs live
