name: 每日精选

on:
  workflow_dispatch:

# Cloudflare Worker Cron 负责生产调度；此工作流只保留人工补发能力。
concurrency:
  group: frontend-weekly-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发布到 2aran 内容数据层
        run: node scripts/publish-2aran-feed.mjs daily
