name: 每日精选

on:
  schedule:
    # 每天 UTC 01:00 = CST 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发

# 与 7x24 资讯任务共用一个串行组，避免同时改写 R2 索引。
concurrency:
  group: frontend-weekly-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发布到 2aran 内容数据层
        run: node scripts/publish-2aran-feed.mjs daily
